<script type="text/javascript" src="/homey.js" data-origin="settings"></script>

<p data-i18n="settings.intro"></p>

<details>
  <summary data-i18n="settings.guide_title"></summary>

  <p data-i18n="settings.guide_desktop"></p>
  <p><a class="ext" href="https://tools.developer.homey.app/apps">tools.developer.homey.app/apps</a></p>

  <p data-i18n="settings.guide_order"></p>

  <h4 data-i18n="settings.guide_step1"></h4>
  <p><a class="ext" href="https://tools.developer.homey.app/webhooks">tools.developer.homey.app/webhooks</a></p>
  <p data-i18n="settings.guide_step1_body"></p>

  <h4 data-i18n="settings.guide_step2"></h4>
  <p><a class="ext" href="https://developer.withings.com/dashboard/create">developer.withings.com/dashboard/create</a></p>
  <p data-i18n="settings.guide_step2_body"></p>
  <p data-i18n="settings.guide_step2_urls"></p>
  <pre>https://callback.athom.com/oauth2/callback/</pre>
  <p data-i18n="settings.guide_step2_slash"></p>

  <p data-i18n="settings.guide_step2_base"></p>
  <pre>https://webhooks.athom.com/webhook/&lt;WEBHOOK_ID&gt;</pre>
  <p data-i18n="settings.guide_step2_full"></p>
  <pre>https://webhooks.athom.com/webhook/&lt;WEBHOOK_ID&gt;/?homey=&lt;HOMEY_ID&gt;</pre>

  <p>
    <button id="identity" class="homey-button-secondary-full" data-i18n="settings.show_identity"></button>
  </p>
  <pre id="identityResult" class="copyable"></pre>
  <p>
    <button id="copyUrl" class="homey-button-secondary-full" data-i18n="settings.copy_url" hidden></button>
  </p>

  <p data-i18n="settings.guide_step2_scopes"></p>

  <h4 data-i18n="settings.guide_step3"></h4>
  <p data-i18n="settings.guide_step3_body"></p>
</details>

<fieldset>
  <legend data-i18n="settings.withings"></legend>

  <label for="clientId" data-i18n="settings.client_id"></label>
  <input id="clientId" type="text" autocomplete="off" spellcheck="false" />

  <label for="clientSecret" data-i18n="settings.client_secret"></label>
  <input id="clientSecret" type="password" autocomplete="off" spellcheck="false" />
</fieldset>

<fieldset>
  <legend data-i18n="settings.webhook"></legend>

  <label for="webhookId" data-i18n="settings.webhook_id"></label>
  <input id="webhookId" type="text" autocomplete="off" spellcheck="false" />

  <label for="webhookSecret" data-i18n="settings.webhook_secret"></label>
  <input id="webhookSecret" type="password" autocomplete="off" spellcheck="false" />
</fieldset>

<p>
  <button id="save" class="homey-button-primary-full" data-i18n="settings.save"></button>
</p>

<p>
  <button id="test" class="homey-button-secondary-full" data-i18n="settings.test"></button>
</p>

<p id="status"></p>
<pre id="result" class="copyable"></pre>
<p>
  <button id="copyResult" class="homey-button-secondary-full" data-i18n="settings.copy_url" hidden></button>
</p>

<style>
  /* Long URLs must wrap and stay selectable rather than run off the screen.
     Applies to the guide's examples too, which are wider than a phone. */
  pre {
    white-space: pre-wrap;
    word-break: break-all;
    user-select: text;
    -webkit-user-select: text;
  }
</style>

<script type="application/javascript">
  const FIELDS = {
    clientId: 'WITHINGS_CLIENT_ID',
    clientSecret: 'WITHINGS_CLIENT_SECRET',
    webhookId: 'WEBHOOK_ID',
    webhookSecret: 'WEBHOOK_SECRET'
  };

  function onHomeyReady(Homey) {
    const status = document.getElementById('status');

    /**
     * Clipboard access is often unavailable in the phone app's webview, so fall
     * back to a hidden textarea and execCommand. If both fail the text is still
     * selectable on screen, which is why nothing here throws.
     */
    function copyText(text, button) {
      const done = ok => {
        const label = Homey.__(ok ? 'settings.copied' : 'settings.copy_failed');
        const previous = button.textContent;
        button.textContent = label;
        setTimeout(() => { button.textContent = previous; }, 2000);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => done(true), () => fallback());
        return;
      }

      fallback();

      function fallback() {
        try {
          const area = document.createElement('textarea');
          area.value = text;
          area.setAttribute('readonly', '');
          area.style.position = 'fixed';
          area.style.opacity = '0';
          document.body.appendChild(area);
          area.select();
          area.setSelectionRange(0, text.length);
          const ok = document.execCommand('copy');
          document.body.removeChild(area);
          done(ok);
        } catch {
          done(false);
        }
      }
    }

    // A plain target="_blank" is a dead end inside the phone app's webview.
    // Homey.openURL hands the link to the real browser where it exists; on
    // desktop the normal navigation still works.
    document.querySelectorAll('a.ext').forEach(link => {
      link.addEventListener('click', event => {
        if (typeof Homey.openURL !== 'function') return;
        event.preventDefault();
        Homey.openURL(link.href);
      });
    });

    // Load each stored value into its field.
    Object.entries(FIELDS).forEach(([elementId, key]) => {
      Homey.get(key, (err, value) => {
        if (!err && value) document.getElementById(elementId).value = value;
      });
    });

    document.getElementById('save').addEventListener('click', () => {
      const entries = Object.entries(FIELDS);
      let remaining = entries.length;
      let failed = null;

      entries.forEach(([elementId, key]) => {
        const value = document.getElementById(elementId).value.trim();

        Homey.set(key, value, err => {
          if (err) failed = err;
          remaining -= 1;

          if (remaining === 0) {
            if (failed) {
              Homey.alert(failed);
            } else {
              status.textContent = Homey.__('settings.saved');
            }
          }
        });
      });
    });

    document.getElementById('identity').addEventListener('click', () => {
      const out = document.getElementById('identityResult');
      out.textContent = Homey.__('settings.testing');

      Homey.api('GET', '/identity', null, (err, res) => {
        if (err) {
          out.textContent = `${Homey.__('settings.test_failed')}: ${err.message || err}`;
          return;
        }

        out.textContent = [
          `Homey ID: ${res.homeyId}`,
          '',
          res.webhookUrl,
          res.webhookKnown ? '' : Homey.__('settings.identity_no_webhook')
        ].filter(Boolean).join('\n');

        const copy = document.getElementById('copyUrl');
        copy.hidden = false;
        copy.onclick = () => copyText(res.webhookUrl, copy);
      });
    });

    document.getElementById('test').addEventListener('click', () => {
      const result = document.getElementById('result');

      status.textContent = Homey.__('settings.testing');
      result.textContent = '';

      // Send whatever is in the fields, so an unsaved correction can be tested
      // before it is committed. Blank fields let the app resolve its own value.
      const payload = {};
      Object.keys(FIELDS).forEach(elementId => {
        payload[elementId] = document.getElementById(elementId).value.trim();
      });

      Homey.api('POST', '/testCredentials', payload, (err, res) => {
        status.textContent = '';

        if (err) {
          result.textContent = `${Homey.__('settings.test_failed')}: ${err.message || err}`;
          return;
        }

        const source = res.source.settings ? 'app settings'
          : res.source.env ? `env.json (${res.source.env})`
            : Homey.__('settings.no_source');

        const probe = Object.entries(res.envProbe || {})
          .map(([name, keys]) => `  ${name}: ${keys.length ? keys.join(', ') : 'tom'}`)
          .join('\n');

        const lines = [
          `${res.withings.ok ? '✓' : '✗'} Withings: ${res.withings.message}`,
          `${res.webhook.ok ? '✓' : '✗'} Webhook: ${res.webhook.message}`,
          '',
          `${Homey.__('settings.client_id')}: ${res.clientId || '?'}`,
          `${Homey.__('settings.source')}: ${source}`,
          `Homey ID: ${res.homeyId || '?'}`,
          '',
          Homey.__('settings.env_probe'),
          probe
        ];

        // Without a webhook id there is no URL to register, so the hint would
        // dangle over an em dash. Say what to do instead.
        if (res.webhookUrl) {
          lines.push('', Homey.__('settings.webhook_url_hint'), res.webhookUrl);
        } else {
          lines.push('', Homey.__('settings.no_webhook_url'));
        }

        result.textContent = lines.join('\n');

        // Only the URL is ever pasted elsewhere; the rest of the result is
        // diagnostics meant to be read, not carried around.
        const copy = document.getElementById('copyResult');
        copy.hidden = !res.webhookUrl;
        copy.onclick = () => copyText(res.webhookUrl, copy);
      });
    });

    Homey.ready();
  }
</script>
