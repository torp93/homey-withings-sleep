<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <title>Sleep Analyzer</title>
  <!--
    The mat itself, not a bed: this is the driver icon and has to read as the
    device. A wide rounded pad with two quilted seams and the cable leaving one
    end. Stroke weight matches the capability icons so the set looks related,
    and everything stays well inside the canvas so nothing clips at small
    sizes.
  -->
  <g fill="none" stroke="#000" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <rect x="95" y="175" width="360" height="150" rx="40"/>
    <path d="M255 195v110M345 195v110"/>
    <path d="M95 250H60a35 35 0 0 0-35 35v40"/>
  </g>
</svg>
